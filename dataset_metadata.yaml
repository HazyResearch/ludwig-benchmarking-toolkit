# ---------------------------------------------------------------------------
# New Ludwig built-in datasets — all modalities
# ---------------------------------------------------------------------------

# --- Text classification (free download) ---

ohsumed_cmu:
  source: ludwig
  description: "OHSUMED medical abstract classification (6-class)"
  target_column: class
  task_type: multiclass
  priority: 5
  tags: [text, classification, medical, ludwig_builtin]

reuters_cmu:
  source: ludwig
  description: "Reuters-21578 newswire classification (6-class)"
  target_column: class
  task_type: multiclass
  priority: 5
  tags: [text, classification, news, ludwig_builtin]

jigsaw_unintended_bias100K:
  source: ludwig
  description: "Jigsaw toxicity classification 100K (binary) — text + identity features"
  target_column: target
  task_type: binary
  priority: 6
  tags: [text, classification, toxicity, multimodal, ludwig_builtin]

# --- Multimodal tabular+text (free download via S3) ---

google_qa_answer_type_reason_explanation:
  source: ludwig
  description: "Google Quest QA — answer type/reason/explanation score (regression)"
  target_column: answer_type_reason_explanation
  task_type: regression
  priority: 5
  tags: [text, tabular, multimodal, regression, ludwig_builtin]

google_qa_question_type_reason_explanation:
  source: ludwig
  description: "Google Quest QA — question type/reason/explanation score (regression)"
  target_column: question_type_reason_explanation
  task_type: regression
  priority: 5
  tags: [text, tabular, multimodal, regression, ludwig_builtin]

mercari_price_suggestion100K:
  source: ludwig
  description: "Mercari price suggestion 100K — product title+description → log price"
  target_column: log_price
  task_type: regression
  priority: 6
  tags: [text, tabular, multimodal, regression, ludwig_builtin]

# --- Rating / multi-target regression (free download) ---

goodbooks_books:
  source: ludwig
  description: "Goodbooks-10K average book rating (regression)"
  target_column: average_rating
  task_type: regression
  priority: 4
  tags: [tabular, regression, ludwig_builtin]

# --- Generative / seq2seq (free download) ---

alpaca:
  source: ludwig
  description: "Stanford Alpaca instruction-following dataset (text generation)"
  target_column: output
  task_type: text_generation
  priority: 4
  tags: [text, generative, llm, instruction_tuning, ludwig_builtin]

code_alpaca:
  source: ludwig
  description: "Code Alpaca code-generation instruction dataset (text generation)"
  target_column: output
  task_type: text_generation
  priority: 4
  tags: [text, generative, llm, code, ludwig_builtin]

# --- Image (free download) ---

flickr8k:
  source: ludwig
  description: "Flickr8k image captioning (text generation from image)"
  target_column: caption0
  task_type: text_generation
  priority: 4
  tags: [image, text, generative, captioning, ludwig_builtin]

# --- Kaggle dataset API required (credentials needed, no competition rules) ---

consumer_complaints:
  source: ludwig
  description: "Consumer complaint issue classification (text→category) [kaggle_credentials_required]"
  target_column: Issue
  task_type: multiclass
  priority: 4
  tags: [text, classification, kaggle, kaggle_credentials_required]

ohsumed_7400:
  source: ludwig
  description: "OHSUMED 7400 medical text classification (category) [kaggle_credentials_required]"
  target_column: intent
  task_type: multiclass
  priority: 4
  tags: [text, classification, medical, kaggle, kaggle_credentials_required]

wmt15:
  source: ludwig
  description: "WMT15 French→English translation (text generation) [kaggle_credentials_required]"
  target_column: en
  task_type: text_generation
  priority: 3
  tags: [text, generative, translation, kaggle, kaggle_credentials_required]

camseq:
  source: ludwig
  description: "CamSeq semantic segmentation (image→image mask) [kaggle_credentials_required]"
  target_column: mask_path
  task_type: image_segmentation
  priority: 3
  # UNet decoder requires skip-connection encoder; incompatible with generic concat combiner.
  # Smoke test skips this until a dedicated segmentation pipeline is supported.
  skip_smoke_test: true
  tags: [image, segmentation, kaggle, kaggle_credentials_required]

# --- Kaggle competition required ---

talkingdata_adtrack_fraud_detection:
  source: ludwig
  description: "TalkingData AdTracking fraud detection (binary) [kaggle_credentials_required]"
  target_column: is_attributed
  task_type: binary
  priority: 4
  tags: [tabular, classification, fraud, kaggle, kaggle_credentials_required]
