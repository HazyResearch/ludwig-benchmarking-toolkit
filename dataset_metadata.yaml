# Ludwig Mega-AutoML Benchmark — Dataset Metadata
#
# Each top-level key is the dataset_name used throughout the system.
# Fields:
#   source          : "openml" | "ludwig" | "kaggle" | "path"
#   openml_task_id  : integer, required when source=openml
#   description     : human-readable summary
#   target_column   : output/label column name
#   task_type       : "binary" | "multiclass" | "regression"
#   priority        : integer, higher runs first (default 0)
#   tags            : list of strings

# ---------------------------------------------------------------------------
# Tabular — Ludwig built-in
# ---------------------------------------------------------------------------

